# Builds, tests and packages the Repatch module on every push and pull request.
#
# The job runs on GitHub's Apple Silicon image (macos-26), fetches the pinned
# PCL commit from GitLab, builds PCL's static libraries once (cached), then
# runs ./build.sh (core, tests, CLI, module) and scripts/package.sh.
#
# The artifact is UNSIGNED: PixInsight code signatures (.xsgn) can only be
# produced by the PixInsight core application with the developer's .xssk key,
# and PixInsight cannot run on a hosted runner. Sign locally with
# ./sign_module.sh and re-run scripts/package.sh to produce an installable
# package (see docs/developer-guide.md, "Continuous integration").
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PCL_REPO: https://gitlab.com/pixinsight/PCL.git
  # PCL 2.10.4 = PixInsight 1.9.4 Lockhart. Must match the core the module is installed into.
  PCL_SHA: afea714e681853dfc21e70b5d53811ae41849e97

jobs:
  macos-arm64:
    name: macOS arm64 — build, test, package
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Repatch
    steps:
      - name: Check out Repatch
        uses: actions/checkout@v7
        with:
          path: Repatch

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang++ --version | head -1
          cmake --version | head -1
          echo "xcode=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "sdk=$(xcrun --show-sdk-version)" >> "$GITHUB_OUTPUT"

      # The key changes with the PCL commit, the compiler/SDK and the PCL build
      # scripts, so a stale cache can never be reused.
      - name: PCL cache key
        id: pcl-key
        run: echo "key=pcl-${PCL_SHA}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-sdk${{ steps.toolchain.outputs.sdk }}-${{ hashFiles('Repatch/scripts/build_pcl.sh', 'Repatch/scripts/pcl_env.sh') }}" >> "$GITHUB_OUTPUT"

      # PCL sources + the static libraries built from them.
      - name: Restore PCL (sources and static libraries)
        id: pcl-cache
        uses: actions/cache/restore@v6
        with:
          path: PCL
          key: ${{ steps.pcl-key.outputs.key }}

      - name: Fetch PCL
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git init -q PCL
          git -C PCL remote add origin "$PCL_REPO"
          git -C PCL fetch --depth 1 origin "$PCL_SHA"
          git -C PCL checkout -q FETCH_HEAD
          rm -rf PCL/.git

      # Built separately from the module so that the slow part is cached even
      # when the module build or the tests fail. Object files are not needed
      # once the .a files exist (build_pcl.sh skips libraries that are present).
      - name: Build PCL static libraries
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build_pcl.sh ../PCL
          find ../PCL/src -type d -path '*/macosx/g++/arm64' -prune -exec rm -rf {} +

      - name: Save PCL cache
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: PCL
          key: ${{ steps.pcl-key.outputs.key }}

      - name: Build core, tests, CLI and module; run tests
        run: bash ./build.sh

      - name: Package
        run: bash scripts/package.sh --out=dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Repatch-macosx-arm64-unsigned-${{ github.sha }}
          path: Repatch/dist/
          if-no-files-found: error
          retention-days: 30
